<template>
    <lightning-card title="User Form">
        <div class="slds-p-around_medium">
            <lightning-input  label="First Name" name="firstName" onchange={handleChange}></lightning-input>
            <br>
            <lightning-input label="Last Name" name="lastName" onchange={handleChange}></lightning-input>
            <br>
            <lightning-input label="Email" name="email" type="email" onchange={handleChange}></lightning-input>
            <br>
            <lightning-input label="Phone" name="phone" type="tel" onchange={handleChange}></lightning-input>
            <br>
            <lightning-input label ="Title" name="title" onchange={handleChange}></lightning-input>
            <br>
            <lightning-button label="Save" variant="brand" onclick={handleSave}></lightning-button>

        </div>
    </lightning-card>
</template>
