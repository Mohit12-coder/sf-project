<template>
    <lightning-card title="Edit Account (Advanced Form)">

        <lightning-record-edit-form
            record-id={recordId}
            object-api-name="Account"
            onsuccess={handleSuccess}
            onerror={handleError}>

           
            <lightning-input-field field-name="Name"></lightning-input-field>
            <lightning-input-field field-name="Phone"></lightning-input-field>
            <lightning-input-field field-name="Industry"></lightning-input-field>

            
            <div >
                <lightning-button  variant="brand" type="submit" label="Save"></lightning-button>

                <lightning-button variant="neutral" label="Reset" onclick={handleReset}></lightning-button>
            </div>

        </lightning-record-edit-form>

    </lightning-card>

    <template if:true={isModalOpen}>
        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- Header -->
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">
                        Account Updated Successfully
                    </h2>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium">

                    <p><b>Name:</b> {updatedData.Name.value}</p>
                    <p><b>Phone:</b> {updatedData.Phone.value}</p>
                    <p><b>Industry:</b> {updatedData.Industry.value}</p>

                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button label="Close" onclick={closeModal}> </lightning-button>
                </footer>

            </div>
        </section>

        <!-- Backdrop -->
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={isModalOpen}>
    <lightning-modal-header label="Account Updated Successfully"></lightning-modal-header>
    <lightning-modal-body>
        <p><b>Name:</b> {updatedData.Name.value}</p>
        <p><b>Phone:</b> {updatedData.Phone.value}</p>
        <p><b>Industry:</b> {updatedData.Industry.value}</p>
    </lightning-modal-body>
    <lightning-modal-footer >
        <lightning-button label="Close" onclick={closeModal}> </lightning-button>
    </lightning-modal-footer>
    </template>
</template>
