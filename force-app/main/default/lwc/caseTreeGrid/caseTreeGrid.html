<template>
    <lightning-card title="Case Detail" icon-name="standard:case">
        <div class="slds-p-around_medium">
            <template if:true={data}>
                <lightning-tree-grid key-field="id" data={data} columns={columns} hide-checkbox-column></lightning-tree-grid>
            </template>

            <template if:true={error}>
                <div class="slds-text-color_error slds-m-top_small">
                    {error}
                </div>
            </template>
        </div>
    </lightning-card>
</template>
