<template>

    <!-- 🔄 Spinner -->
    <template if:true={isLoading}>
        <div class="slds-align_absolute-center slds-m-top_medium">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>

    <!-- ✅ Eligible Account -->
    <template if:true={isEligibleAccount}>

        <lightning-card title="Related Contacts" icon-name="standard:contact">

            <!-- Contacts Grid -->
            <template if:true={contacts.length}>
                <div class="slds-grid slds-wrap slds-p-around_small">

                    <template for:each={contacts} for:item="con">
                        <div key={con.Id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">

                            <div class="slds-box slds-box_x-small slds-theme_default contact-card"
                                 data-id={con.Id}
                                 onclick={handleNavigate}>

                                <div class="slds-media">

                                    <!-- Icon -->
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="standard:contact" size="small"></lightning-icon>
                                    </div>

                                    <!-- Content -->
                                    <div class="slds-media__body">
                                        <p class="slds-text-heading_small slds-truncate">
                                            {con.Name}
                                        </p>

                                        <p class="slds-text-body_small">
                                            📧 {con.Email}
                                        </p>

                                        <p class="slds-text-body_small">
                                            📞 {con.Phone}
                                        </p>
                                    </div>

                                </div>

                            </div>

                        </div>
                    </template>

                </div>
            </template>

            <!-- Empty State -->
            <template if:false={contacts.length}>
                <div class="slds-align_absolute-center slds-p-around_medium">
                    <p>No Contacts Found</p>
                </div>
            </template>

        </lightning-card>

    </template>

    <!-- ❌ Not Eligible -->
    <template if:false={isEligibleAccount}>
        <div class="slds-align_absolute-center slds-p-around_medium">
            <p>🚫 Account does not meet criteria</p>
        </div>
    </template>

</template>
