<template>
    <div class="slds-box">
        <h3 class="slds-text-heading_small slds-m-bottom_small"> Selected Contacts </h3>

        <div class="slds-grid slds-wrap">
            <template for:each={contacts} for:item="contact">
                <div key={contact.contactId} class="slds-m-right_small slds-m-bottom_small">
                    <lightning-pill label={contact.contactName} name={contact.contactId} onremove={handleRemove}></lightning-pill>
                </div>
            </template>
        </div>
    </div>
</template>
