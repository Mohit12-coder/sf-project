<template>
    <div class="slds-grid slds-grid_align-end slds-m-bottom_small">
        <lightning-button label="View Full Screen" variant="brand-outline" onclick={handleOpenModal}></lightning-button>
    </div>

    <lightning-card
        title="Related Cases">
        <div class="slds-p-around_medium">
            <template if:true={casesList.length}>
                <lightning-datatable  key-field="Id" data={casesList} columns={caseColumns} hide-checkbox-column></lightning-datatable>
            </template>

            <template if:false={casesList.length}>
                <div class="slds-text-color_weak"> No Cases Found</div>
            </template>
        </div>
    </lightning-card>

    <lightning-card title="Related Tasks" class="slds-m-top_large">
        <div class="slds-p-around_medium">
            <template if:true={tasksList.length}>
                <lightning-datatable key-field="taskId" data={tasksList} columns={taskColumn hide-checkbox-column></lightning-datatable>
            </template>

            <template if:false={tasksList.length}>
                <div class="slds-text-color_weak"> No Tasks Found </div>
            </template>
        </div>
    </lightning-card>
</template>
