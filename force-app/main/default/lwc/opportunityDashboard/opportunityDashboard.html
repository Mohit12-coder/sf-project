<template>
    <lightning-card title="Opportunity Dashboard">
        <c-opportunity-top-bar ontogglemenu={handleToggleMenu} onsearchchange={handleSearchChange}> </c-opportunity-top-bar>

        <template if:true={errorMessage}>
            <div class="slds-p-around_small slds-text-color_error">
                {errorMessage}
            </div>
        </template>

        <template if:true={showMenu}>
            <div class="slds-grid slds-wrap">
                <div class="slds-col slds-size_2-of-12">
                    <c-opportunity-filter-panel filter-rows={filterRows} onapplyfilter={handleApplyFilter} onremovefilterrow={handleRemoveFilter} onclearall={handleClearAll}> </c-opportunity-filter-panel>
                </div>

                <div class="slds-col slds-size_10-of-12">
                    
                    <div class="slds-p-around_small">
                        <c-opportunity-list records={pageRecords} page-number={pageNumber} total-pages={totalPages} is-loading={isLoading} onprevious={handlePrevious} onnext={handleNext} onrefreshdata={handleDataRefresh}> </c-opportunity-list>
                    </div>

                </div>
            </div>

        </template>

        <template if:false={showMenu}>
            <div class="slds-grid slds-wrap">
                <div class="slds-col slds-size_1-of-1">
                    <div class="slds-p-around_small">
                        <c-opportunity-list records={pageRecords} page-number={pageNumber} total-pages={totalPages} is-loading={isLoading} onprevious={handlePrevious} onnext={handleNext} onrefreshdata={handleDataRefresh}> </c-opportunity-list>
                    </div>
                </div>
            </div>
        </template>

        
    </lightning-card>
</template>
