<template>
    <template if:false={isEditMode}>
        <div class="slds-grid slds-grid_vertical-align-center">
            <div class="slds-truncate slds-m-right_x-small">
                {accountName}
            </div>

            <lightning-button-icon icon-name="utility:edit" size="x-small" variant="bare" onclick={handleEdit}></lightning-button-icon>
        </div>
    </template>

    <template if:true={isEditMode}>
        <template if:true={selectedAccountName}>
            <lightning-pill label={selectedAccountName} onremove={handleRemoveSelection}> </lightning-pill>
        </template>

        <template if:false={selectedAccountName}>
            <div class="slds-combobox_container">
                <div class={lookupClass} role="combobox">

                    <div class="slds-combobox__form-element">
                        <lightning-input type="search" variant="label-hidden" placeholder="Search Account" value={searchText} onchange={handleSearch} onclick={openDropdown}></lightning-input>
                    </div>

                    <template if:true={showDropdown}>
                        <div class="slds-dropdown slds-dropdown_fluid slds-dropdown_length-5">
                            <ul class="slds-listbox slds-listbox_vertical">

                                <template for:each={records} for:item="item">
                                    <li key={item.Id} class="slds-listbox__item" data-id={item.Id} data-name={item.Name} onclick={handleSelect}>

                                        <div class="slds-media slds-listbox__option slds-media_small slds-media_center">
                                            <span class="slds-media__figure">
                                                <lightning-icon icon-name="standard:account" size="x-small"> </lightning-icon>
                                            </span>

                                            <span class="slds-media__body">
                                                <span class="slds-truncate">{item.Name}</span>
                                            </span>
                                        </div>

                                    </li>
                                </template>

                            </ul>
                        </div>
                    </template>

                </div>
            </div>
        </template>

        <div class="slds-m-top_x-small">
            <lightning-button label="Save" variant="brand" onclick={handleSave}> </lightning-button>

            <lightning-button class="slds-m-left_x-small" label="Cancel" onclick={handleCancel}></lightning-button>
        </div>
    </template>
</template>
