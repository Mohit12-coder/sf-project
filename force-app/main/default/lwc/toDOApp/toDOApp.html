<template>
    <lightning-card title="To Do App" icon-name="standard : task">
        <div class="slds-m-around_medium">
            <lightning-input label="New Task" value={newTask} onchange={handleChange}></lightning-input>

            <lightning-button label="Add Task" variant="brand" onclick={addTask} class="slds-m-top_small"></lightning-button>
        </div>

        <template if:true={tasks.length}>
            <ul class="slds-m-around_medium">
                <template for:each={tasks} for:item="task">
                    <li key={task.id} class="task-item">
                        <lightning-input type="checkbox" checked={task.completed} data-id={task.id} onchange={toggleTask}></lightning-input>

                        <span class={task.className}>{task.name}</span>

                        <lightning-button-icon icon-name="utility:delete" alternative-text="Delete" onclick={deleteTask} data-id={task.id} ></lightning-button-icon>
                    </li>
                </template>
            </ul>
        </template>

        <template if:false={tasks.length}>
            <p class="slds-m-around_medium">No tasks yet.</p>
        </template>
    </lightning-card>
</template>
